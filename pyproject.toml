[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sao-hand-recognition"
version = "0.1.0"
description = "Starter code for hand recognition with finger detection."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mediapipe",
    "opencv-python",
]

[project.scripts]
finger-detector = "hand_recognition.webcam:main"

[tool.setuptools.packages.find]
where = ["src"]
